<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#090e15">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Sadhana</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&display=swap" media="print" onload="this.media='all'">
<style>
:root{--b:#f3f2ec;--c:#fffffe;--t:#15181a;--m:#656b70;--ln:rgba(0,0,0,.12);--a:#8b7cf6;--a2:#e0b84c;--a3:#5b6ee1;--on:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--b:#090e15;--c:#131a1c;--t:#f0f3ee;--m:#98a29f;--ln:rgba(255,255,255,.12)}}
:root[data-theme=dark]{--b:#090e15;--c:#131a1c;--t:#f0f3ee;--m:#98a29f;--ln:rgba(255,255,255,.12)}
[data-skin=lime]{--a:#c6f432;--a2:#3ddc97;--a3:#4aa3ff;--on:#0e1400}
[data-skin=zen]{--a:#7fa88a;--a2:#a3aaa6;--a3:#cdd8d0;--on:#10170f}
[data-skin=fit]{--a:#ff7a2f;--a2:#19b5a5;--a3:#ffb02f;--on:#1b1006}
[data-skin=hybrid]{--a:#8b7cf6;--a2:#ff8a3d;--a3:#e0b84c;--on:#fff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:inherit}
body{margin:0;font:600 15px/1.4 Nunito,ui-rounded,system-ui,sans-serif;color:var(--t);background:color-mix(in srgb,var(--a) 7%,var(--b));padding-bottom:100px}
.bg{position:fixed;inset:0;overflow:hidden;z-index:0;pointer-events:none}
.bg i{position:absolute;will-change:transform,opacity}
.bg i:nth-child(1){inset:-30%;background:radial-gradient(circle at 20% 80%,var(--a) 0,transparent 30%),radial-gradient(circle at 80% 90%,var(--a2) 0,transparent 28%);opacity:.5;animation:dr 24s ease-in-out infinite alternate}
.bg i:nth-child(2){inset:-30%;background:radial-gradient(circle at 60% 70%,var(--a3) 0,transparent 32%),radial-gradient(circle at 10% 30%,var(--a2) 0,transparent 22%);opacity:.38;animation:dr 36s ease-in-out infinite alternate-reverse}
.bg i:nth-child(3){inset:0;background:linear-gradient(to top,color-mix(in srgb,var(--a3) 60%,transparent),transparent 55%);animation:gl 8s ease-in-out infinite alternate}
@keyframes dr{to{transform:translate3d(10%,-8%,0) rotate(30deg) scale(1.15)}}
@keyframes gl{from{opacity:.45}to{opacity:1}}
[data-motion=off] .bg i{animation:none}
[data-motion=full] .bg i:nth-child(n){animation-duration:12s}
@media(prefers-reduced-motion:reduce){.bg i{animation:none}}
#app{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:14px}
.hd{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:22px;font-weight:800;margin-bottom:12px}
.hd-l{display:flex;align-items:center;gap:10px}
.dn{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.dn input{flex:1}
.card{background:color-mix(in srgb,var(--c) 84%,transparent);border:1px solid var(--ln);border-radius:24px;padding:16px;margin-bottom:12px}
h3{margin:0 0 10px;font-size:17px;font-weight:800;display:flex;align-items:center;justify-content:space-between;gap:8px}
small{color:var(--m);font-size:13px}
label{display:block;margin-top:10px;color:var(--m);font-size:13px}
input,textarea,select{width:100%;margin-top:4px;font:inherit;color:var(--t);background:transparent;border:1px solid var(--ln);border-radius:14px;padding:10px 12px}
input[type=color]{padding:2px;height:38px}
.btn{border:0;border-radius:999px;padding:11px 18px;font:inherit;font-weight:800;background:var(--a);color:var(--on);cursor:pointer;transition:transform .12s,opacity .15s}
.btn:active{transform:scale(.96)}
.btn.g{background:transparent;color:var(--t);border:1px solid var(--ln)}
.btn.sm{padding:6px 12px;font-size:13px}
.ic{border:1px solid var(--ln);background:transparent;color:var(--t);border-radius:12px;min-width:36px;height:36px;font:inherit;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.ic:disabled{opacity:.3}
.ar,.en{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--ln);cursor:pointer}
.card h3+.ar,.card h3+.en{border-top:0}
.sw{width:12px;height:12px;border-radius:50%;flex:none}
.ico-bd{width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:17px;flex:none}
.gr{flex:1;min-width:0}
.gr small{display:block;overflow:hidden;text-overflow:ellipsis}
.sp{display:flex;justify-content:space-between;align-items:center;gap:8px}
.bar{height:6px;border-radius:9px;background:var(--ln);margin-top:5px;overflow:hidden}
.bar u{display:block;height:100%;border-radius:9px;transition:width .3s ease}
.top{display:flex;align-items:center;gap:14px}
.wd i{display:inline-block;width:14px;height:14px;border-radius:50%;margin-right:5px}
.r{display:flex;align-items:center;gap:6px;margin-top:8px}.r span{flex:1}
.dot,.ch button{border:1px solid var(--ln);background:transparent;color:var(--t);border-radius:50%;width:38px;height:38px;font:inherit;font-weight:800;cursor:pointer}
.ch{display:flex;gap:8px;margin-top:8px}.ch button{border-radius:999px;flex:1;width:auto}
.dot.on,.ch button.on,.seg button.on,.emo.on{background:var(--a);color:var(--on);border-color:transparent}
.tap{margin:10px auto 0;width:150px;height:150px;border-radius:50%;background:var(--a);color:var(--on);font-size:44px;font-weight:800;display:flex;align-items:center;justify-content:center;user-select:none;cursor:pointer;box-shadow:0 8px 28px color-mix(in srgb,var(--a) 45%,transparent)}
.tap:active{transform:scale(.95)}
.big{font-size:56px;font-weight:800;text-align:center;margin:8px 0;font-variant-numeric:tabular-nums}
.wpc .bt{flex-wrap:wrap}.bt{display:flex;gap:10px;margin-top:14px}.bt .btn{flex:1}
.g3,.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}.seg button{border:1px solid var(--ln);background:transparent;color:var(--t);border-radius:999px;padding:7px 13px;font:inherit;font-size:13px;cursor:pointer}
.ga{display:grid;grid-template-columns:36px 1fr 64px 58px 34px 34px;gap:6px;align-items:center;margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid var(--ln)}
.ga small{font-size:11px}
.er{color:#e5484d;min-height:18px;margin:8px 0 0;font-size:13px}
.dev-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}
.dev-tile{border:1px solid var(--ln);border-radius:16px;padding:10px;background:color-mix(in srgb,var(--a) 5%,transparent);min-width:0}
.dev-tile b{display:block;font-size:18px;font-weight:800}
.dev-tile small{display:block;font-size:11px;overflow-wrap:anywhere}
.dev-next{display:flex;align-items:center;gap:10px;padding:11px;margin-top:10px;border:1px dashed color-mix(in srgb,var(--a) 55%,var(--ln));border-radius:16px}
.dev-next .gr{min-width:0}
.dev-next .btn{flex:none}

.train-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:10px 0}
.train-choice{border:1px solid var(--ln);border-radius:16px;padding:12px;background:color-mix(in srgb,var(--a) 5%,transparent);text-align:left;color:var(--t);font:inherit;cursor:pointer}
.train-choice b{display:block;font-size:15px}.train-choice small{display:block;margin-top:4px;font-size:12px}
.train-item{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-top:1px solid var(--ln)}
.train-item input{width:20px;height:20px;margin:2px 0;accent-color:var(--a);flex:none}
.train-item span{flex:1}.train-stat{display:flex;gap:8px;flex-wrap:wrap}.train-stat .badge-tag{padding:6px 9px}
/* v4.1 Personal Intelligence */
.trend-card{border-color:color-mix(in srgb,var(--a3) 35%,var(--ln));background:linear-gradient(145deg,color-mix(in srgb,var(--a3) 8%,var(--c)),var(--c))}.trend-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:12px 0}.trend-stat{padding:10px;border:1px solid var(--ln);border-radius:14px;min-width:0}.trend-stat b{display:block;font-size:18px;overflow-wrap:anywhere}.trend-stat small{font-size:11px;display:block}.trend-insight{margin:8px 0;padding:10px 12px;border-left:3px solid var(--a3);border-radius:0 12px 12px 0;background:color-mix(in srgb,var(--a3) 8%,transparent)}

.command-card{background:linear-gradient(145deg,color-mix(in srgb,var(--a) 16%,var(--c)),color-mix(in srgb,var(--a3) 9%,var(--c)));border:1px solid color-mix(in srgb,var(--a) 38%,var(--ln));}
.command-kicker{font-size:10px;letter-spacing:1.5px;font-weight:900;color:var(--a);text-transform:uppercase}
.command-metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 0}
.command-metric{padding:10px;border:1px solid var(--ln);border-radius:15px;background:color-mix(in srgb,var(--c) 65%,transparent);min-width:0}
.command-metric b{display:block;font-size:20px}.command-metric small{font-size:11px;display:block}
.command-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}
.command-actions .btn{width:100%;padding:10px 8px;font-size:13px}
.command-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px;padding-top:9px;border-top:1px solid var(--ln)}
@media(max-width:360px){.command-metrics{grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}.command-metric{padding:8px}.command-metric b{font-size:17px}}
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:space-around;align-items:center;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--c) 94%,transparent);border-top:1px solid var(--ln)}
nav button{background:none;border:0;color:var(--m);font:inherit;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;min-width:54px}
nav button b{font-size:20px}nav button.on{color:var(--t)}
nav .plus{width:60px;height:60px;border-radius:50%;background:var(--c);border:1px solid var(--ln);margin-top:-26px;display:flex;align-items:center;justify-content:center;min-width:0;box-shadow:0 0 24px color-mix(in srgb,var(--a) 60%,transparent)}nav .plus svg{width:30px;height:30px}
#sh{position:fixed;inset:0;z-index:9;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center}
#sh>div{background:var(--c);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:26px 26px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
#ai{position:fixed;inset:0;z-index:6;display:none;flex-direction:column;padding-top:env(safe-area-inset-top,0px);background:transparent}
.ah{display:flex;align-items:center;gap:8px;padding:10px 14px;font-weight:800;font-size:18px;border-bottom:1px solid var(--ln)}.ah b{flex:1}
#am{flex:1;overflow:auto;padding:12px 18px;max-width:660px;width:100%;margin:0 auto}
.em{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:16px;padding-bottom:40px}
.st{width:54px;height:54px}.em h1{font-size:28px;line-height:1.2;margin:0;font-weight:800}
.cp{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}.cp button{border:1px solid var(--ln);background:color-mix(in srgb,var(--c) 70%,transparent);color:var(--t);border-radius:999px;padding:8px 13px;font:inherit;font-size:13px;cursor:pointer}
.um-w{display:flex;flex-direction:column;align-items:flex-end;margin:14px 0}
.um{width:fit-content;max-width:84%;background:color-mix(in srgb,var(--a) 22%,var(--c));border:1px solid color-mix(in srgb,var(--a) 35%,transparent);border-radius:22px 22px 6px 22px;padding:10px 14px;white-space:pre-wrap}
.um-bar{display:flex;gap:6px;margin-top:4px;opacity:.75}
.um-bar button{background:none;border:0;color:var(--m);font:inherit;font-size:11px;cursor:pointer;padding:2px 6px;border-radius:6px}
.um-bar button:hover{background:var(--ln);color:var(--t)}
.am{margin:12px 0 22px;line-height:1.65;font-size:15.5px}
.am code{background:var(--ln);padding:2px 6px;border-radius:6px;font-size:13.5px}
.ac{display:flex;align-items:center;gap:8px;border:1px solid var(--ln);border-radius:16px;padding:8px 10px;margin-top:8px;background:color-mix(in srgb,var(--a) 8%,transparent)}.ac span{flex:1;font-size:14px}
.ab{padding:8px 14px calc(14px + env(safe-area-inset-bottom,0px));max-width:660px;width:100%;margin:0 auto}
.ip{display:flex;align-items:flex-end;gap:6px;background:color-mix(in srgb,var(--c) 92%,transparent);border:1px solid var(--ln);border-radius:30px;padding:8px}
.ip textarea{border:0;margin:0;padding:8px 4px;resize:none;max-height:120px;flex:1;width:auto;outline:0}
.ip button{width:42px;height:42px;border-radius:50%;border:0;background:var(--a);color:var(--on);font-size:18px;flex:none;display:flex;align-items:center;justify-content:center;cursor:pointer}
.ip #mic{background:transparent;color:var(--t);display:none}.ip #mic.on{background:var(--a);color:var(--on)}
.ip #att{background:transparent;color:var(--t);font-size:24px}
.sh1{height:14px;border-radius:9px;margin:10px 0;background:linear-gradient(90deg,transparent,var(--a),var(--a3),var(--a2),transparent);background-size:200% 100%;animation:shm 1.6s linear infinite;opacity:.85}
@keyframes shm{to{background-position:-200% 0}}
.ts{display:flex;align-items:center;gap:8px;color:var(--m);font-size:14px}.ts svg{width:18px;height:18px;animation:sp 2.4s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.bd{display:inline-block;border:1px solid var(--ln);border-radius:999px;padding:6px 12px;margin:0 6px 6px 0;font-size:13px}.bd.on{background:var(--a);color:var(--on);border-color:transparent}
.rg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
@media print{body>*:not(#sh){display:none!important}#sh{position:static!important;background:none!important;display:block!important}#sh>div{max-height:none!important;overflow:visible!important;border-radius:0!important;max-width:none!important;padding:0!important}.noprint{display:none!important}}
.am table{border-collapse:collapse;margin:8px 0;font-size:14px;display:block;overflow-x:auto}.am td,.am th{border:1px solid var(--ln);padding:6px 10px;text-align:left}
.pre-w{position:relative;margin:8px 0}
.pre-cp{position:absolute;top:6px;right:6px;border:1px solid var(--ln);background:var(--c);color:var(--t);border-radius:8px;padding:3px 8px;font-size:11px;cursor:pointer;opacity:.85}
.pre-cp:hover{opacity:1;background:var(--a);color:var(--on)}
.am pre{background:var(--ln);border-radius:12px;padding:28px 12px 10px;overflow-x:auto;font-size:13px;white-space:pre-wrap;margin:0}
.th{color:var(--m);font-size:13px;margin:0 0 8px}.th div{margin-top:4px}
details{margin-top:10px}summary{cursor:pointer;color:var(--m)}

/* Typewriter & Cursor Animation */
.tw-cur{display:inline-block;width:8px;height:16px;background:var(--a);vertical-align:middle;margin-left:3px;border-radius:2px;animation:curBlink .75s infinite alternate;box-shadow:0 0 8px var(--a)}
@keyframes curBlink{0%{opacity:1;transform:scaleY(1)}100%{opacity:.15;transform:scaleY(.7)}}
.am-body{}
@keyframes fadeInMsg{from{opacity:.4;transform:translateY(3px)}to{opacity:1;transform:translateY(0)}}

/* Sleek Icon-Only AI Action Bar & 3-Dots Dropdown */
.ai-bar{display:flex;align-items:center;gap:4px;margin-top:8px;padding-top:6px;position:relative}
.ai-ic{width:32px;height:32px;border-radius:9px;border:0;background:transparent;color:var(--m);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:background .15s,color .15s,transform .1s;padding:0}
.ai-ic svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ai-ic:hover,.ai-ic.on{background:color-mix(in srgb,var(--a) 18%,transparent);color:var(--t)}
.ai-ic:active{transform:scale(.9)}
.ai-sep{flex:1}
.ai-more-wrap{position:relative;display:inline-block}
.ai-menu{position:absolute;bottom:38px;right:0;min-width:185px;background:var(--c);border:1px solid var(--ln);border-radius:16px;padding:6px;box-shadow:0 10px 30px rgba(0,0,0,.28);display:none;flex-direction:column;gap:2px;z-index:25}
.ai-menu.open{display:flex;animation:fadeInMsg .15s ease-out}
.ai-menu button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;color:var(--t);font:600 13px Nunito,sans-serif;padding:8px 10px;border-radius:10px;cursor:pointer;text-align:left}
.ai-menu button svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;color:var(--m);flex:none}
.ai-menu button:hover{background:color-mix(in srgb,var(--a) 16%,transparent)}
.ai-menu hr{border:0;border-top:1px solid var(--ln);margin:3px 0}
.um-bar{display:flex;gap:2px;margin-top:3px;opacity:.65}
.um-bar .ai-ic{width:26px;height:26px}
.um-bar .ai-ic svg{width:14px;height:14px}

/* Floating Selection Toolbar (Compact Icons) */
#sel-bar{position:fixed;z-index:20;display:none;align-items:center;gap:3px;background:var(--c);border:1px solid var(--a);border-radius:999px;padding:4px 6px;box-shadow:0 8px 26px rgba(0,0,0,.35)}
#sel-bar button{border:0;background:transparent;color:var(--t);width:32px;height:32px;border-radius:50%;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0}
#sel-bar button svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#sel-bar button:hover{background:var(--a);color:var(--on)}

/* Emoji Grid & Habit Modal */
.emo-g{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.emo{width:38px;height:38px;border-radius:11px;border:1px solid var(--ln);background:transparent;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.badge-tag{font-size:10.5px;padding:2px 7px;border-radius:99px;background:var(--ln);color:var(--m);margin-left:6px;font-weight:600}
.chk-btn{width:36px;height:36px;border-radius:50%;border:2px solid var(--ln);background:transparent;color:var(--t);font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center}
.chk-btn.done{background:var(--a);color:var(--on);border-color:var(--a)}
.toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%);background:var(--t);color:var(--b);padding:8px 16px;border-radius:999px;font-size:13px;font-weight:800;z-index:30;opacity:0;pointer-events:none;transition:opacity .25s}
.toast.on{opacity:1}

/* Breathing Pacer & 108 Mala Ring */
.pacer-box{display:flex;flex-direction:column;align-items:center;justify-content:center;margin:14px 0;position:relative}
.pacer-ring{width:170px;height:170px;border-radius:50%;border:3px solid var(--ln);display:flex;align-items:center;justify-content:center;position:relative}
.pacer-orb{width:90px;height:90px;border-radius:50%;background:radial-gradient(circle,var(--a),var(--a3));color:var(--on);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;box-shadow:0 0 32px color-mix(in srgb,var(--a) 60%,transparent);transition:transform .3s linear}
.mala-wrap{position:relative;width:210px;height:210px;margin:10px auto;display:flex;align-items:center;justify-content:center;user-select:none;cursor:pointer}
.mala-wrap svg{position:absolute;inset:0;width:100%;height:100%}
.mala-center{position:relative;z-index:2;text-align:center;pointer-events:none}
.mala-center b{font-size:40px;display:block;line-height:1}
.zen-on #sh>div{max-height:100%;height:100%;border-radius:0;display:flex;flex-direction:column;justify-content:center}
.zen-on .zen-hide{display:none!important}
.corr-pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11.5px;font-weight:800}
[data-skin=calm]{--a:#8b7cf6;--a2:#e0b84c;--a3:#5b6ee1;--on:#fff}
@media(pointer:coarse){input,textarea,select{font-size:16px}}

/* v3.5 Adaptive Intelligence */
.adapt-card{border:1px solid color-mix(in srgb,var(--a) 42%,var(--ln));background:linear-gradient(145deg,color-mix(in srgb,var(--a) 11%,var(--c)),var(--c));}

// Web Audio Ambient Sound Synthesizer
function setAmbient(mode){
  stopAmbient();
  AMB.mode=mode;
  if(mode==='off')return;
  try{
    const c=AMB.ctx||(AMB.ctx=new(window.AudioContext||window.webkitAudioContext)());
    if(c.state==='suspended')c.resume();
    if(mode==='om'||mode==='432'||mode==='528'){
      const baseFreq=mode==='om'?136.1:mode==='432'?432:528;
      [1,1.5,2].forEach((mult,idx)=>{
        const o=c.createOscillator(),g=c.createGain();
        o.type=idx===0?'sine':'triangle';
        o.frequency.value=baseFreq*mult;
        g.gain.value=idx===0?0.12:idx===1?0.04:0.02;
        o.connect(g);g.connect(c.destination);o.start();
        AMB.nodes.push({o,g});
      });
    }else if(mode==='brown'){
      const bufSize=c.sampleRate*2,buf=c.createBuffer(1,bufSize,c.sampleRate),data=buf.getChannelData(0);
      let last=0;
      for(let i=0;i<bufSize;i++){const w=Math.random()*2-1;data[i]=(last+(0.02*w))/1.02;last=data[i];data[i]*=0.18}
      const src=c.createBufferSource(),flt=c.createBiquadFilter(),g=c.createGain();
      src.buffer=buf;src.loop=true;flt.type='lowpass';flt.frequency.value=420;g.gain.value=0.35;
      src.connect(flt);flt.connect(g);g.connect(c.destination);src.start();
      AMB.nodes.push({o:src,g});
    }
  }catch(x){}
}
function stopAmbient(){
  AMB.nodes.forEach(n=>{try{n.o.stop();n.o.disconnect()}catch(x){}});
  AMB.nodes=[];AMB.mode='off';
}
function cueTone(freq,dur){
  try{
    const c=AMB.ctx||(AMB.ctx=new(window.AudioContext||window.webkitAudioContext)());
    if(c.state==='suspended')c.resume();
    const o=c.createOscillator(),g=c.createGain();
    o.frequency.value=freq;o.connect(g);g.connect(c.destination);
    g.gain.setValueAtTime(0.08,c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+(dur||0.25));
    o.start();o.stop(c.currentTime+(dur||0.26));
  }catch(x){}
}

function trendWindow(endDate, length){

  const activeDays=days.filter(d=>S.logs.some(l=>l&&l.d===d)).length;
  const restDays=days.filter(d=>Object.prototype.hasOwnProperty.call(S.rest||{},d)).length;
  const sessions=(S.training?.sessions||[]).filter(x=>x&&days.includes(x.date)).length;
  const checkins=days.map(d=>S.mood?.[d]).filter(m=>m&&(Number(m.m)>0||Number(m.e)>0));
  const mood=checkins.filter(m=>Number(m.m)>0),energy=checkins.filter(m=>Number(m.e)>0);

  return {activeDays,restDays,sessions,checkinDays:checkins.length,moodN:mood.length,energyN:energy.length,avgMood:avg(mood.map(m=>m.m)),avgEnergy:avg(energy.map(m=>m.e))};
 };
 return {recent:summarize(recent),prior:summarize(prior),recentDays:recent,priorDays:prior};

function autoWeekDates(){
 const d=new Date(T+'T12:00:00'),dow=(d.getDay()+6)%7,monday=add(T,-dow);
 return Array.from({length:7},(_,i)=>add(monday,i));
}
function autoEstimate(a){
 if(a.type==='time')return Math.max(3,Math.min(25,+a.goal||10));
 if(a.type==='workout')return 12;
 if(a.type==='slots')return 6;
 if(a.type==='count')return Math.max(3,Math.min(12,Math.ceil((+a.goal||30)/18)));
 return 3;
}
function autoFocusMatch(a,focus){
 const c=(a.cat||'').toLowerCase();
 if(focus==='mental')return c==='mental';
 if(focus==='physical')return c==='physical';
 if(focus==='study')return c==='study';
 if(focus==='discipline')return ['lifestyle','study'].includes(c);
 return true;
}
function autoBuildDraft(){
 const prefs=S.coachPrefs||{focus:'balanced',days:5,minutes:30};
 const budget=Math.max(10,Math.min(90,+prefs.minutes||30));
 const requested=Math.max(3,Math.min(7,+prefs.days||5));
 const dates=autoWeekDates();
 const eligible=S.acts.filter(a=>a&&a.per==='day');
 const target=eligible.length?requested:0;
 let pool=eligible.filter(a=>autoFocusMatch(a,prefs.focus||'balanced'));
 if(!pool.length)pool=eligible.slice();
 pool.sort((a,b)=>autoEstimate(a)-autoEstimate(b));
 const schedule=dates.map(date=>({date,kind:'flex',tasks:[]}));
 // Spread practice days through the week rather than clustering them.
 const chosen=[];
 for(let n=0;n<target;n++)chosen.push(Math.min(6,Math.round(n*6/(target-1||1))));
 const unique=[...new Set(chosen)];
 schedule.forEach((day,i)=>{if(!unique.includes(i)){day.kind='flex';return;}day.kind='practice';let mins=0;
   const ordered=pool.slice().sort((a,b)=>{
     const ac=(a.cat||'')===((prefs.focus==='balanced')?'mental':prefs.focus==='discipline'?'lifestyle':prefs.focus);
     const bc=(b.cat||'')===((prefs.focus==='balanced')?'mental':prefs.focus==='discipline'?'lifestyle':prefs.focus);
     return Number(bc)-Number(ac);
   });
   for(const a of ordered){if(day.tasks.length>=3)break;const estimate=autoEstimate(a);if(mins+estimate>budget)continue;if(day.tasks.some(t=>t.id===a.id))continue;day.tasks.push({id:a.id,mins:estimate});mins+=estimate;}
 });
 const noHabits=!eligible.length;
 return {id:'plan-'+Date.now(),created:new Date().toISOString(),weekStart:dates[0],weekEnd:dates[6],focus:prefs.focus||'balanced',days:target,budget,schedule,approved:false,noHabits};
}
function autoPlanProgress(plan){
 let planned=0,logged=0,met=0,minutes=0,doneDays=0;
 (plan?.schedule||[]).forEach(day=>{if(day.kind!=='practice')return;let dayLogged=0;day.tasks.forEach(t=>{planned++;minutes+=+t.mins||0;const a=S.acts.find(x=>x.id===t.id);if(a){const v=pr(a,day.date);if(v>0){logged++;dayLogged++;}if(v>=a.goal)met++;}});if(dayLogged)doneDays++;});
 return {planned,logged,met,minutes,doneDays};
}

 S.autonomy.reviews.unshift(review);S.autonomy.reviews=S.autonomy.reviews.slice(0,20);save();render();toast('Local progress review saved ✓');

function journalMemoryData(days=30){
 const from=add(T,-days+1),entries=Object.entries(S.jr||{}).filter(([d,t])=>d>=from&&d<=T&&String(t||'').trim());
 const groups=[['Focus & attention',/focus|concentrat|attention|distract|deep work|ध्यान|एकाग्र/i],['Study & learning',/study|learn|revision|jee|exam|problem|पढ़|अध्ययन|सीख/i],['Consistency & habits',/consistent|habit|routine|discipline|streak|regular|आदत|नियमित/i],['Energy & recovery',/tired|energy|sleep|rest|recover|stress|थक|नींद|आराम/i],['Gratitude & positivity',/grateful|gratitude|thankful|happy|proud|शुक्र|आभार|खुश/i],['Challenges & obstacles',/difficult|hard|struggle|failed|missed|problem|challenge|मुश्किल|कठिन/i]];
 const themes=groups.map(([name,re])=>({name,count:entries.filter(([,t])=>re.test(t)).length})).filter(x=>x.count).sort((a,b)=>b.count-a.count);
 return {from,to:T,entries,themes,total:entries.length};
}

// ---- v4.2 Goal Intelligence & Routine Optimiser ----
function goalHabitEvidence(a,days=14){
 const start=a.ca&&/^\d{4}-\d\d-\d\d$/.test(a.ca)?(a.ca>T?a.ca:T):add(T,-days+1);
 const range=Array.from({length:days},(_,i)=>add(T,-days+1+i)).filter(d=>d>=start&&d<=T);
 const eligible=range.filter(d=>!S.rest[d]);
 const met=eligible.filter(d=>pr(a,d)>=a.goal).length;
 const some=eligible.filter(d=>pr(a,d)>0).length;
 return {eligible:eligible.length,met,some,rate:eligible.length?Math.round(met/eligible.length*100):0};
}
function goalRecommendations(){
 return S.acts.filter(a=>a.per==='day'&&a.type!=='workout').map(a=>({a,...goalHabitEvidence(a,14)})).filter(x=>x.eligible>=7).map(x=>{
  if(x.rate<=35&&x.some<=Math.max(2,Math.ceil(x.eligible*.5)))return {...x,kind:'simplify',title:'Consider a smaller target',detail:`Met on ${x.met}/${x.eligible} eligible days. If the current target feels difficult to fit, consider testing ${Math.max(1,Math.round(x.a.goal*.8))} ${U(x.a)} for a week.`,suggested:Math.max(1,Math.round(x.a.goal*.8))};
  if(x.rate>=85)return {...x,kind:'steady',title:'Keep this target steady',detail:`Met on ${x.met}/${x.eligible} eligible days. The current target appears workable; there is no need to increase it now.`,suggested:null};
  return {...x,kind:'review',title:'Review the routine fit',detail:`Met on ${x.met}/${x.eligible} eligible days. Check timing, friction and whether the target matches your available time.`,suggested:null};
 });
}
function estimateHabitMinutes(a){
 if(a.type==='time')return Math.max(2,Math.min(45,Math.round(+a.goal||5)));
 if(a.type==='count')return Math.max(2,Math.min(15,Math.ceil((+a.goal||10)/18)));
 if(a.type==='slots')return 3;
 if(a.type==='check')return 2;
 return 8;
}
function routineCandidates(focus){
 const daily=S.acts.filter(a=>a.per==='day'&&a.type!=='workout'&&!['physical'].includes(a.cat==='physical'&&a.type==='workout'?'physical':''));
 const pref=focus==='balanced'?daily:daily.filter(a=>a.cat===focus).concat(daily.filter(a=>a.cat!==focus));
 return pref.filter(a=>!S.rest[T]||a.cat!=='physical');
}
function buildRoutinePlan(){
 const minutes=Math.max(10,Math.min(90,Number($('#goalMinutes')?.value||S.profile.minutes||30)));
 const focus=$('#goalFocus')?.value||S.profile.focus||'balanced';
 const candidates=routineCandidates(focus);let used=0,tasks=[];
 for(const a of candidates){const mins=estimateHabitMinutes(a);if(used+mins<=minutes){tasks.push({id:a.id,mins});used+=mins;}}
 if(!tasks.length&&candidates.length){const a=candidates[0];tasks=[{id:a.id,mins:Math.min(minutes,estimateHabitMinutes(a))}];used=tasks[0].mins;}
 const p={date:T,minutes,focus,tasks,created:new Date().toISOString()};
 S.goalPlan=S.goalPlan||{plans:{}};S.goalPlan.plans=S.goalPlan.plans||{};S.goalPlan.plans[T]=p;S.profile.minutes=minutes;S.profile.focus=focus;save();render();toast('A manageable routine plan was saved');
}
function goalPlanProgress(p){const tasks=p?.tasks||[];let logged=0,met=0;tasks.forEach(t=>{const a=S.acts.find(x=>x.id===t.id);if(a&&pr(a,T)>0)logged++;if(a&&pr(a,T)>=a.goal)met++;});return {total:tasks.length,logged,met,minutes:tasks.reduce((n,t)=>n+(+t.mins||0),0)};}
function applyGoalSuggestion(id,value){const a=S.acts.find(x=>x.id===id);if(!a)return;const old=a.goal;if(!cfm(`Change “${a.n}” from ${old} to ${value} ${U(a)}? This changes only the future target; existing logs remain unchanged.`))return;a.goal=value;save();render();toast('Goal updated. Review it after one week.');}
function goalIntelligencePanel(){
 const recs=goalRecommendations(),p=S.goalPlan?.plans?.[T],prog=goalPlanProgress(p),minutes=Number(S.profile.minutes||30),focus=S.profile.focus||'balanced';
 const focusOpts=[['balanced','Balanced'],['mental','Mental'],['physical','Physical'],['study','Study'],['lifestyle','Lifestyle']].map(([v,l])=>`<option value="${v}" ${focus===v?'selected':''}>${l}</option>`).join('');
 const tasks=p?.tasks?.map(t=>{const a=S.acts.find(x=>x.id===t.id);if(!a)return '';const v=pr(a,T),status=v>=a.goal?'Target met':v>0?'Progress logged':'Not logged yet';return `<div class="goal-plan-task"><span>${e(a.ico||'🎯')}</span><div class="gr"><b>${e(a.n)}</b><small>${t.mins} min estimate · ${status}</small></div><span class="goal-chip">${fmt(v)}/${a.goal}</span></div>`}).join('')||'';
 const rows=recs.length?recs.map(x=>`<div class="goal-row"><div class="sp"><div class="gr"><b>${e(x.a.ico||'🎯')} ${e(x.a.n)}</b><small>${x.met}/${x.eligible} days met · ${x.rate}%</small></div><span class="goal-chip">${x.title}</span></div><small>${e(x.detail)}</small>${x.kind==='simplify'?`<div class="bt"><button class="btn g sm" onclick="applyGoalSuggestion('${x.a.id}',${x.suggested})">Review change to ${x.suggested}</button></div>`:''}</div>`).join(''):'<small>Not enough recent daily-habit data yet. Keep logging normally; suggestions appear after at least seven eligible days.</small>';
 return `<section class="card adapt-card"><div class="sp"><div><div class="command-kicker">GOALS</div><h3 style="margin:3px 0 0">Goal review & routine optimiser</h3></div><span class="badge-tag">Local analysis</span></div><p style="margin:8px 0">Use recent practice records to review target fit and build a daily plan that stays within your available time. Nothing changes automatically.</p><div class="goal-grid"><div class="goal-stat"><b>${recs.length}</b><small>Habits with enough evidence</small></div><div class="goal-stat"><b>${minutes} min</b><small>Current daily time preference</small></div></div><label>Available time today<select id="goalMinutes"><option value="10" ${minutes===10?'selected':''}>10 minutes</option><option value="15" ${minutes===15?'selected':''}>15 minutes</option><option value="20" ${minutes===20?'selected':''}>20 minutes</option><option value="30" ${minutes===30?'selected':''}>30 minutes</option><option value="45" ${minutes===45?'selected':''}>45 minutes</option><option value="60" ${minutes===60?'selected':''}>60 minutes</option><option value="90" ${minutes===90?'selected':''}>90 minutes</option></select></label><label>Planning focus<select id="goalFocus">${focusOpts}</select></label><div class="bt"><button class="btn sm" onclick="buildRoutinePlan()">Build / refresh today's routine</button></div>${p?`<div class="goal-row"><div class="sp"><b>Today's planned routine</b><span class="goal-chip">${prog.minutes}/${p.minutes} min estimated</span></div><div class="goal-grid"><div class="goal-stat"><b>${prog.logged}/${prog.total}</b><small>Planned habits with activity logged</small></div><div class="goal-stat"><b>${prog.met}/${prog.total}</b><small>Full habit targets met</small></div></div>${tasks||'<small>No active planned habits.</small>'}<small>These are estimates, not deadlines. Partial practice counts as activity logged; the full target is shown separately.</small>`:'<small>No routine saved for today yet. Build one to compare planned habits with actual logs.</small>'}</div><div class="goal-row"><b>Goal-fit suggestions · last 14 days</b><small>Only daily habits with at least 7 eligible days are assessed. Rest days are excluded. Weekly habits and workout targets are not automatically assessed.</small>${rows}</div><small>Recommendations are optional planning aids, not judgements. A low completion rate can reflect schedule changes, illness, recovery or missing logs. Existing goals and records are never changed without your confirmation.</small></section>`;
}

  if('Notification' in window&&Notification.permission==='granted'){
   const reg=('serviceWorker' in navigator)?await navigator.serviceWorker.getRegistration():null;

function checkReminders(){

}

function researchSkillLevel(skillId){

function renderMalaSVG(cnt){
  const inMala=cnt%108,malas=Math.floor(cnt/108);
  let beads='';
  for(let i=0;i<54;i++){
    const ang=(i/54)*2*Math.PI-Math.PI/2;
    const x=(105+88*Math.cos(ang)).toFixed(1),y=(105+88*Math.sin(ang)).toFixed(1);
    const activeBead=i*2<inMala||(inMala===0&&cnt>0);
    beads+=`<circle cx="${x}" cy="${y}" r="${i===0?5:3.2}" fill="${activeBead?'var(--a)':'var(--ln)'}"/>`;
  }
  return `<svg viewBox="0 0 210 210">${beads}</svg>
    <div class="mala-center">
      <b>${cnt}</b>
      <small>${malas} Mala · ${inMala}/108</small>
      <div style="font-size:11px;color:var(--a);margin-top:4px">Tap anywhere on ring</div>
    </div>`;
}

function tsec(){return(TM.el+(TM.run?Date.now()-TM.st:0))/1000}

function updatePacer(s){
  if(!TM.bp||TM.bp==='off')return;
  const r=BP_RATIOS[TM.bp].r,tot=r[0]+r[1]+r[2]+r[3];
  if(!tot)return;
  const c=s%tot;
  let phase='',rem=0,scale=1;
  if(c<r[0]){phase='Inhale';rem=Math.ceil(r[0]-c);scale=0.85+0.55*(c/r[0])}
  else if(c<r[0]+r[1]){phase='Hold';rem=Math.ceil(r[0]+r[1]-c);scale=1.4}
  else if(c<r[0]+r[1]+r[2]){const e=c-r[0]-r[1];phase='Exhale';rem=Math.ceil(r[2]-e);scale=1.4-0.55*(e/r[2])}
  else{const e=c-r[0]-r[1]-r[2];phase='Hold Out';rem=Math.ceil(r[3]-e);scale=0.85}
  const orb=$('#porb'),pl=$('#plab'),ps=$('#psec');
  if(orb)orb.style.transform=`scale(${scale.toFixed(2)})`;
  if(pl)pl.textContent=phase;
  if(ps)ps.textContent=rem+'s';
  if(phase!==TM.lastPhase){
    TM.lastPhase=phase;
    cueTone(phase==='Inhale'?440:phase==='Hold'?528:330,0.18);navigator.vibrate&&navigator.vibrate(phase==='Inhale'?[40]:phase==='Exhale'?[25,60,25]:[15]);
  }
}

function tgl(){
  if(TM.run){
    TM.el+=Date.now()-TM.st;TM.run=0;clearInterval(TM.iv);tsave();
    reqWakeLock(false);
    $('#ts').textContent='▶ Resume';
  }else{
    try{TM.c=TM.c||new(window.AudioContext||window.webkitAudioContext)()}catch(x){}
    reqWakeLock(true);
    TM.st=Date.now();TM.run=1;$('#ts').textContent='⏸ Pause';tsave();
    TM.iv=setInterval(()=>{
      const s=tsec(),t=$('#tt');
      if(!t)return clearInterval(TM.iv);
      t.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(Math.floor(s%60)).padStart(2,'0');
      updatePacer(s);
      const g=+$('#tg').value;
      if(g>0&&!TM.rung&&s>=g*60){TM.rung=1;bell()}
    },200);
  }
}

function stp(){
  const s=tsec();clearInterval(TM.iv);stopAmbient();reqWakeLock(false);document.body.classList.remove('zen-on');
  if(s<1){closeSh();return}
  openLog(TM.a.id,null,{v:Math.max(.1,Math.round(s/6)/10)},TM.fromRoutine);
}

// Make Hinglish / Roman Hindi sound natural instead of robotic spelling
function prepSpeechText(raw){
  let t=raw.replace(/```[\s\S]*?```/g,' ').replace(/`[^`]+`/g,' ').replace(/[*#_~>|•]/g,' ').replace(/https?:\/\/\S+/g,'').replace(/\s+/g,' ').trim();
  // Common Hinglish phonetic normalizations so Indian voices pronounce them naturally
  const map={
    '\\bnhi\\b':'nahi','\\bnahi\\b':'naheen','\\bkese\\b':'kaise','\\bkesa\\b':'kaisa','\\bkr\\b':'kar',
    '\\bkro\\b':'karo','\\bkrna\\b':'karna','\\bbhai\\b':'bhaai','\\byaar\\b':'yaar','\\baacha\\b':'achha',
    '\\bacha\\b':'achha','\\bbohat\\b':'bahut','\\bbohot\\b':'bahut','\\bsamjhao\\b':'samjhaao',
    '\\bpadhai\\b':'padhaai','\\bzyada\\b':'zyaada','\\bjaida\\b':'zyaada','\\bkyu\\b':'kyun','\\bkyuki\\b':'kyunki'
  };
  for(const [k,v] of Object.entries(map))t=t.replace(new RegExp(k,'gi'),v);
  return t;
}
function pickBestVoice(txt){
  if(!VOICES.length&&'speechSynthesis' in window)VOICES=speechSynthesis.getVoices();
  const hasDeva=/[ऀ-ॿ]/.test(txt);
  const savedV=S.set.voice||'auto';
  if(savedV!=='auto'){
    const found=VOICES.find(v=>v.name===savedV);
    if(found)return found;
  }
  // Prefer natural/neural Indian voices (Google / Microsoft Swara, Madhur, Neerja, Prabhat)
  const score=v=>{
    const n=(v.name+' '+v.lang).toLowerCase();
    let s=0;
    if(n.includes('natural')||n.includes('neural')||n.includes('online'))s+=50;
    if(n.includes('google')||n.includes('microsoft'))s+=25;
    if(n.includes('swara')||n.includes('neerja')||n.includes('prabhat')||n.includes('madhur')||n.includes('aditi')||n.includes('rishi')||n.includes('lekha'))s+=30;
    if(hasDeva){
      if(v.lang==='hi-IN'||n.includes('hindi'))s+=40;
      else if(v.lang.endsWith('-IN'))s+=20;
    }else{
      // For Roman Hinglish + English, en-IN or hi-IN natural voices read both smoothly
      if(v.lang==='en-IN')s+=40;
      else if(v.lang==='hi-IN')s+=35;
      else if(v.lang.startsWith('en-'))s+=10;
    }
    return s;
  };
  return [...VOICES].sort((a,b)=>score(b)-score(a))[0]||null;
}
async function speakGeminiTTS(txt,i){
  const k=kv();
  if(!k||S.ai.prov!=='gemini')return false;
  try{
    toast('Generating natural voice…');
    const u='https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key='+k;
    const b={
      contents:[{parts:[{text:'Read this naturally and warmly in an Indian conversational tone (Hinglish/Hindi/English as written): '+txt.slice(0,1800)}]}],
      generationConfig:{responseModalities:['AUDIO'],speechConfig:{voiceConfig:{prebuiltVoiceConfig:{voiceName:S.set.aiVoice||'Aoede'}}}}
    };
    const r=await fetch(u,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b)});
    if(!r.ok)return false;
    const j=await r.json();
    const part=j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts&&j.candidates[0].content.parts[0];
    if(!part||!part.inlineData||!part.inlineData.data)return false;
    // Convert raw PCM16 24kHz base64 to playable WAV
    const b64=part.inlineData.data,bin=atob(b64),len=bin.length;
    const wav=new ArrayBuffer(44+len),view=new DataView(wav);
    const wr=(o,s)=>{for(let q=0;q<s.length;q++)view.setUint8(o+q,s.charCodeAt(q))};
    wr(0,'RIFF');view.setUint32(4,36+len,true);wr(8,'WAVEfmt ');view.setUint32(16,16,true);
    view.setUint16(20,1,true);view.setUint16(22,1,true);view.setUint32(24,24000,true);
    view.setUint32(28,48000,true);view.setUint16(32,2,true);view.setUint16(34,16,true);
    wr(36,'data');view.setUint32(40,len,true);
    const bytes=new Uint8Array(wav,44);for(let q=0;q<len;q++)bytes[q]=bin.charCodeAt(q);
    if(SPEAK!==i)return true;
    const blob=new Blob([wav],{type:'audio/wav'});

async function speakMsg(i){

  if(!txt)return;

  if(String(S.set.useAiVoice)!=='0'&&kv()&&S.ai.prov==='gemini'){
    const ok=await speakGeminiTTS(txt,i);
    if(ok)return;
  }
  // 2. Smart Chunked Browser Speech (Sentence-by-sentence language & natural voice switching)
  if(!('speechSynthesis' in window)){SPEAK=null;rm();return toast('Voice not supported on this browser')}
  const chunks=txt.match(/[^.!?।\n]+[.!?।\n]*/g)||[txt];
  let idx=0;
  const speakNext=()=>{
    if(SPEAK!==i||idx>=chunks.length){SPEAK=null;rm();return}
    const ch=chunks[idx++].trim();
    if(!ch)return speakNext();
    const u=new SpeechSynthesisUtterance(ch);
    const v=pickBestVoice(ch);
    if(v){u.voice=v;u.lang=v.lang}

  };
  speakNext();
}

 <div class="card"><h3>🏅 Milestones & insights</h3><div class="trend-grid"><div class="trend-stat"><b>${wMilestoneCount()}</b><small>Milestones reached</small></div><div class="trend-stat"><b>${wBestTime()}</b><small>Most logged practice time</small></div></div><div class="trend-insight">${wMilestones()}</div><small>Milestones are based on recorded practice days, not a judgement of ability.</small></div><div class="card"><h3>💳 Spending & no-spend days</h3><div class="g2"><label>Expense name<input id="wexpname" placeholder="What was it?"></label><label>Amount (₹)<input id="wexpamt" type="number" min="0" step=".01" placeholder="0"></label></div><button class="btn sm" onclick="wAddExpense()">Add expense</button><button class="btn g sm" onclick="wNoSpend()">Mark today no-spend</button><div class="trend-grid"><div class="trend-stat"><b>₹${exp.toFixed(2)}</b><small>Logged today</small></div><div class="trend-stat"><b>${W.daily[T]?.noSpend?'Yes':'—'}</b><small>No-spend day</small></div></div>${W.expenses.filter(x=>x.date===T).map(x=>`<div class="slp-row"><div><b>${e(x.name)}</b><small>₹${x.amount}</small></div><button class="ic" onclick="wDel('expenses','${x.id}')">×</button></div>`).join('')}</div>
 <div class="card"><h3>📵 Screen time & no-phone streak</h3><label>Screen time today (minutes)<input id="wscreen" type="number" min="0" max="1440" value="${W.screen[T]??''}" placeholder="Enter from phone's Digital Wellbeing"></label><button class="btn sm" onclick="wSaveScreen()">Save screen time</button><button class="btn g sm" onclick="wNoPhone()">Mark no-phone day</button><div class="trend-grid"><div class="trend-stat"><b>${W.screen[T]==null?'—':W.screen[T]+' min'}</b><small>Screen time logged</small></div><div class="trend-stat"><b>${wNoPhoneStreak()}</b><small>No-phone streak</small></div></div><small>Android does not expose reliable device-wide screen-time data to this standalone page; enter the figure from Digital Wellbeing.</small></div>
 <div class="card"><h3>🔗 Habit chains & streak protection</h3><small>Link habits in the order you want to do them. Rest days and freeze tokens preserve a streak without pretending a habit was completed.</small><label>First habit<select id="wch1">${S.acts.map(a=>`<option value="${e(a.id)}">${e(a.n)}</option>`).join('')}</select></label><label>Then habit<select id="wch2">${S.acts.map(a=>`<option value="${e(a.id)}">${e(a.n)}</option>`).join('')}</select></label><button class="btn sm" onclick="wAddChain()">Create chain</button>${W.chains.map(c=>`<div class="slp-row"><div><b>${e(S.acts.find(a=>a.id===c.a)?.n||'Habit')} → ${e(S.acts.find(a=>a.id===c.b)?.n||'Habit')}</b><small>Sequence reminder</small></div><button class="ic" onclick="wDel('chains','${c.id}')">×</button></div>`).join('')}<div class="bt"><button class="btn g" onclick="wFreeze()">Use streak freeze</button><button class="btn g" onclick="openRest()">Mark rest day</button></div><small>Freeze days available: ${Math.max(0,2-Object.keys(W.freezes).length)}</small></div>
 <div class="card"><h3>🗓 Weekly review</h3><div class="trend-insight">${wWeeklyReport()}</div><button class="btn g sm" onclick="openIntegratedReview()">Open full weekly review</button></div><div class="card"><h3>🎯 Weekly goals & monthly challenge</h3><label>Weekly practice target (days)<input type="number" min="1" max="7" value="${W.weeklyGoal}" onchange="S.wellness.weeklyGoal=Math.max(1,Math.min(7,+this.value||1));save()"></label><label>Monthly challenge name<input id="wchallenge" maxlength="60" value="${e(W.monthly.name)}"></label><label>Challenge start date<input id="wstart" type="date" value="${e(W.monthly.start)}"></label><button class="btn sm" onclick="wSaveChallenge()">Save 30-day challenge</button><div class="trend-insight">${wChallengeProgress()} · Milestones: 7, 21, 30, 66 and 100 practice days.</div><div class="bt"><button class="btn g" onclick="wExportCSV()">Export tracking CSV</button><button class="btn g" onclick="window.print()">Print / Save PDF</button></div></div>
 <div class="card"><h3>⚙️ Data, themes & backup</h3><label>Theme<select onchange="document.documentElement.dataset.theme=this.value;S.set.mode=this.value;save()"><option value="auto" ${S.set.mode==='auto'?'selected':''}>System</option><option value="light" ${S.set.mode==='light'?'selected':''}>Light</option><option value="dark" ${S.set.mode==='dark'?'selected':''}>Dark</option></select></label><label>Cloud backup endpoint (optional)<input id="wcloud" type="url" placeholder="HTTPS sync endpoint" value="${e(W.cloudUrl||'')}"></label><button class="btn sm" onclick="wSaveCloud()">Save endpoint</button><button class="btn g sm" onclick="wCloudBackup()">Back up now</button><small>Automatic local saving uses this browser's storage. Cross-device cloud sync requires a trusted endpoint you control; no account or cloud service is silently assumed. Use JSON backup before changing phones.</small></div>`;
}

function wPracticeDays(){return [...new Set(S.logs.map(x=>x.d).filter(Boolean))].sort()}
function wMilestones(){const n=wPracticeDays().length,marks=[7,21,66,100];return marks.map(m=>`${n>=m?'🏅':'🔒'} ${m} days ${n>=m?'unlocked':`(${Math.max(0,m-n)} to go)`}`).join(' · ')}
function wMilestoneCount(){const n=wPracticeDays().length;return [7,21,66,100].filter(m=>n>=m).length+'/4'}
function wBestTime(){const counts={};S.logs.forEach(l=>{const a=S.acts.find(x=>x.id===l.a);const t=a?.tod||'any';counts[t]=(counts[t]||0)+1});const best=Object.entries(counts).sort((a,b)=>b[1]-a[1])[0];return best&&best[0]!=='any'?best[0]:(best?'Any time':'—')}
function wWeeklyReport(){const ds=wlast(7,d=>S.logs.filter(x=>x.d===d).length),entries=ds.reduce((a,x)=>a+x.v,0),days=ds.filter(x=>x.v>0).length,miss=7-days;return `Last 7 days: ${entries} habit entries across ${days}/7 days. ${days>=5?'Consistency was recorded on most days.':days?'Some practice was recorded; there is room to make the routine easier.':'No habit entries were recorded.'} ${miss} days had no logged entries (this does not prove no activity).`}
function wSaveBody(){const weight=+$('#wbw').value,waist=+$('#wbwaist').value,height=+$('#wbheight').value;if(!weight||weight<1||weight>500)return toast('Enter a valid weight.');if(height){S.wellness.height=height}S.wellness.body.push({id:'body'+Date.now(),date:T,weight,waist:waist||null});save();render();toast('Measurement saved')}
function wAddMeal(){const name=$('#wmname').value.trim();if(!name)return toast('Enter a meal name.');S.wellness.meals.push({id:'meal'+Date.now(),date:T,name,cal:Math.max(0,+$('#wmcal').value||0),protein:Math.max(0,+$('#wmpro').value||0),time:$('#wmtime').value||''});save();render();toast('Meal logged')}
function wQuickWater(n){const W=S.wellness;W.water[T]=Math.max(0,(+W.water[T]||0)+n);save();render();toast('Water updated')}
function wOpenDaily(){const x=wday();sheet(`<h3>Daily mood & energy check-in</h3><label>Mood (1–5)<div class="seg">${[1,2,3,4,5].map(n=>`<button class="${x.mood===n?'on':''}" onclick="this.parentNode.querySelectorAll('button').forEach(b=>b.classList.remove('on'));this.classList.add('on');this.parentNode.dataset.v=${n}">${n}</button>`).join('')}</div></label><label>Energy (1–5)<div class="seg">${[1,2,3,4,5].map(n=>`<button class="${x.energy===n?'on':''}" onclick="this.parentNode.querySelectorAll('button').forEach(b=>b.classList.remove('on'));this.classList.add('on');this.parentNode.dataset.v=${n}">${n}</button>`).join('')}</div></label><label>Reflection<textarea id="wdnote" rows="2">${e(x.note||'')}</textarea></label><button class="btn" onclick="wSaveDaily()">Save check-in</button>`)}
function wSaveDaily(){const box=document.querySelectorAll('#sh .seg');const mood=+(box[0]?.dataset.v||0),energy=+(box[1]?.dataset.v||0);Object.assign(wday(),{mood,energy,note:$('#wdnote')?.value||''});save();closeSh();render()}
function wCorrelation(){const rows=wlast(30,d=>{const x=S.wellness.daily[d]||{},sl=(slW().sl2||[]).filter(z=>!z.nap&&ldate(z.wake)===d).reduce((a,z)=>a+slMin(z),0)/60;return x.mood?{mood:+x.mood,sleep:sl,water:+(S.wellness.water[d]||0)}:null}).map(x=>x.v).filter(Boolean);if(rows.length<4)return 'Log at least four daily check-ins to begin exploring possible patterns.';const low=rows.filter(x=>x.sleep>0&&x.sleep<6),high=rows.filter(x=>x.sleep>=7);if(low.length>=2&&high.length>=2){const avg=a=>a.reduce((s,x)=>s+x.mood,0)/a.length;return `In your logged entries, average mood was ${avg(low).toFixed(1)}/5 on nights under 6h sleep (${low.length} entries) and ${avg(high).toFixed(1)}/5 after 7h+ (${high.length} entries). This is an observed association, not proof that sleep caused the mood difference.`}return `${rows.length} daily check-ins recorded. More comparable sleep and mood entries are needed before describing a pattern.`}
function wAddExpense(){const name=$('#wexpname').value.trim(),amount=+$('#wexpamt').value;if(!name||!Number.isFinite(amount)||amount<=0)return toast('Enter expense name and amount.');S.wellness.expenses.push({id:'exp'+Date.now(),date:T,name,amount});wday().noSpend=false;save();render()}
function wNoSpend(){wday().noSpend=true;save();render();toast('No-spend day marked')}
function wSaveScreen(){const v=+$('#wscreen').value;if(!Number.isFinite(v)||v<0||v>1440)return toast('Enter minutes from 0 to 1440.');S.wellness.screen[T]=v;save();render()}
function wNoPhone(){S.wellness.daily[T]=S.wellness.daily[T]||{};S.wellness.daily[T].noPhone=true;save();render()}
function wNoPhoneStreak(){let n=0,d=T;while(n<365&&S.wellness.daily[d]?.noPhone){n++;d=add(d,-1)}return n+' days'}
function wDel(k,id){S.wellness[k]=S.wellness[k].filter(x=>x.id!==id);save();render()}
function wAddChain(){const a=$('#wch1').value,b=$('#wch2').value;if(!a||!b||a===b)return toast('Choose two different habits.');S.wellness.chains.push({id:'chain'+Date.now(),a,b});save();render()}
function wFreeze(){const W=S.wellness,used=Object.keys(W.freezes).length;if(used>=2)return toast('No streak freeze tokens left.');W.freezes[T]='Streak freeze';save();render();toast('Streak freeze used for today')}
function wSaveChallenge(){S.wellness.monthly={name:$('#wchallenge').value.trim()||'30-day challenge',start:$('#wstart').value||T,days:30};save();render();toast('Challenge saved')}
function wChallengeProgress(){const c=S.wellness.monthly,days=Math.max(0,Math.min(30,Math.floor((new Date(T+'T12:00:00')-new Date(c.start+'T12:00:00'))/864e5)+1)),active=new Set(S.logs.filter(l=>l.d>=c.start&&l.d<=T).map(l=>l.d)).size;return `${e(c.name)}: day ${days}/30 · ${active} active practice days`}
function wOpenTimer(){sheet(`<h3>⏱ Training & focus timer</h3><div class="seg"><button class="on" onclick="wSetTimer('focus',1500,this)">Focus 25m</button><button onclick="wSetTimer('tabata',20,this)">Tabata 20s</button><button onclick="wSetTimer('hiit',40,this)">HIIT 40s</button><button onclick="wSetTimer('rest',60,this)">Rest 60s</button></div><div class="big" id="wTimerDisplay">25:00</div><div class="bt"><button class="btn" onclick="wTimerStart()">Start</button><button class="btn g" onclick="wTimerPause()">Pause</button><button class="btn g" onclick="wTimerReset()">Reset</button></div><small>Timer runs while this page remains open. It does not lock the phone or prevent other apps from opening.</small>`)}
let W_TIMER_IV=null,W_TIMER_LEFT=1500;
function wSetTimer(mode,sec,b){wTimerPause();W_TIMER_LEFT=sec;S.wellness.timer={mode,seconds:sec};b.parentNode.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');wTimerPaint()}
function wTimerPaint(){const el=$('#wTimerDisplay');if(el)el.textContent=String(Math.floor(W_TIMER_LEFT/60)).padStart(2,'0')+':'+String(W_TIMER_LEFT%60).padStart(2,'0')}
function wTimerStart(){if(W_TIMER_IV)return;W_TIMER_IV=setInterval(()=>{W_TIMER_LEFT=Math.max(0,W_TIMER_LEFT-1);wTimerPaint();if(!W_TIMER_LEFT){wTimerPause();toast('Timer complete ✓')}},1000)}
function wTimerPause(){clearInterval(W_TIMER_IV);W_TIMER_IV=null}
function wTimerReset(){wTimerPause();W_TIMER_LEFT=S.wellness.timer?.seconds||1500;wTimerPaint()}
function wExportCSV(){const rows=[['type','date','name','value1','value2','note']];S.wellness.body.forEach(x=>rows.push(['body',x.date,'weight/waist',x.weight,x.waist||'', '']));S.wellness.meals.forEach(x=>rows.push(['meal',x.date,x.name,x.cal,x.protein,x.time]));S.wellness.expenses.forEach(x=>rows.push(['expense',x.date,x.name,x.amount,'','']));Object.entries(S.wellness.daily).forEach(([d,x])=>rows.push(['daily',d,'mood/energy',x.mood||'',x.energy||'',x.note||'']));const csv=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=`sadhana-tracking-${T}.csv`;a.click();toast('Tracking CSV exported')}
function wSaveCloud(){S.wellness.cloudUrl=$('#wcloud').value.trim();save();toast('Backup endpoint saved')}
async function wCloudBackup(){const u=S.wellness.cloudUrl;if(!u)return toast('Add your trusted HTTPS endpoint first.');if(!/^https:\/\//i.test(u))return toast('Cloud endpoint must use HTTPS.');try{const r=await fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({app:'Sadhana',version:APP_VERSION,exportedAt:new Date().toISOString(),data:S})});if(!r.ok)throw Error('HTTP '+r.status);toast('Cloud backup sent ✓')}catch(x){toast('Cloud backup failed. Check endpoint and permissions.')}}
const _moreBeforeV5=more;
more=function(){return _moreBeforeV5()+`<div class="card command-card"><div class="command-kicker">NEW · PERSONAL TRACKING</div><h3>Life tracking dashboard</h3><small>Body stats, meals, mood, water, spending, screen time, habit chains, goals and timers.</small><button class="btn" style="width:100%;margin-top:10px" onclick="tb('track')">Open tracking dashboard →</button></div>`};
const _renderBeforeV5=render;
render=function(){if(tab==='track'){const _y=window.scrollY;ap();$('#app').innerHTML=`<div class="hd"><div class="hd-l">${logo()}Sadhana</div><button class="btn g sm" onclick="tb('more')">← More</button></div>${tracking()}`;const n=(t,i,l)=>`<button class="${tab===t?'on':''}" onclick="tb('${t}')"><b>${i}</b>${l}</button>`;$('#nav').innerHTML=n('home',NI.home,'Home')+n('st',NI.st,'Stats')+`<button class="plus" onclick="openAI()">✦</button>`+n('jr',NI.jr,'Journal')+n('more',NI.more,'More');window.scrollTo(0,_y);return}_renderBeforeV5()};

</script></body></html>
